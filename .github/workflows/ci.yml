name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -v
      - name: JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem public -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: Progress graph checks
        run: node test_progress.cjs
      - name: Build and verify source package
        run: |
          python package_dashboard.py
          python verify_package.py work/recomp-observatory.zip
