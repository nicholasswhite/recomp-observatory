name: Feature request
description: Propose a dashboard, adapter, or evidence-model improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Proposed evidence contract
      description: Explain the source, scope, unknown state, and why it is not misleading.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed experience
    validations:
      required: true
